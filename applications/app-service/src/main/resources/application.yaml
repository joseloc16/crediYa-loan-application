server:
  port: 8017
spring:
  application:
    name: "LoanApplication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8016"

adapters:
  r2dbc:
    host: "localhost"
    port: 5431
    database: "credi-loan"
    schema: "public"
    username: "joseloc"
    password: "crediya"

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      auth-exists:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
